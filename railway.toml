# Railway monorepo config — two backend services, rooted at backend/
# Beat scheduler merged into worker (--beat flag) to save one Railway service.
# Nixpacks build phases for each service are defined in backend/nixpacks.toml

[[services]]
name = "api"
root = "backend"
startCommand = "sh -c 'uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT'"

[[services]]
name = "worker"
root = "backend"
# --beat runs the scheduler in the same process.
# Safe for this workload: 11 nightly tasks, not high-concurrency.
startCommand = "uv run celery -A app.tasks.celery_app.celery_app worker --beat --loglevel=info"
